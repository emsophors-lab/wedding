<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធចុះឈ្មោះភ្ញៀវចូលរួមកម្មវិធីមង្គលការ</title>
    <!-- នាំចូលពុម្ពអក្សរខ្មែរពី Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #b82649; /* ពណ៌ផ្កាឈូកក្រហមបែបមង្គលការ */
            --primary-hover: #9c1f3d;
            --accent-color: #d4af37; /* ពណ៌មាស */
            --bg-color: #fcf8f8;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), #da4167);
            color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(184, 38, 73, 0.2);
        }

        header h1 {
            font-family: 'Moul', cursive;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card:nth-child(2) { border-top-color: var(--accent-color); }
        .card:nth-child(3) { border-top-color: #10b981; }

        .card h3 {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-color);
        }

        /* Main Grid: Form + List */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Form Styling */
        .form-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .form-container h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(184, 38, 73, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            height: 70px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }

        /* Guest List Section */
        .list-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fdfafb;
        }

        /* Actions Button */
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            margin-right: 5px;
            transition: background 0.2s;
        }

        .btn-edit {
            background-color: #fef3c7;
            color: #d97706;
        }

        .btn-edit:hover {
            background-color: #fde68a;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete:hover {
            background-color: #fecaca;
        }

        /* Tag Relation */
        .tag-relation {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .tag-groom { background-color: #ebf8ff; color: #2b6cb0; }
        .tag-bride { background-color: #fff5f5; color: #c53030; }
        .tag-other { background-color: #f7fafc; color: #4a5568; }

        /* Notification if no data */
        .no-data {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <h1>មង្គលការយើងខ្ញុំ</h1>
        <p>ប្រព័ន្ធចុះឈ្មោះ និងកត់ត្រាបញ្ជីភ្ញៀវកិត្តិយសចូលរួមកម្មវិធី</p>
    </header>

    <!-- Dashboard Cards -->
    <div class="dashboard">
        <div class="card">
            <h3>ចំនួនគ្រួសារ/បញ្ជីឈ្មោះ</h3>
            <div class="card-value" id="total-registrations">0 នាក់</div>
        </div>
        <div class="card">
            <h3>ចំនួនអ្នកចូលរួមសរុប (រួមទាំងដៃគូ)</h3>
            <div class="card-value" id="total-attendees">0 នាក់</div>
        </div>
        <div class="card">
            <h3>ប្រាក់ចងដៃសរុប</h3>
            <div class="card-value" style="color: #10b981;" id="total-gifts">$0.00</div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
        <!-- Input Form Section -->
        <div class="form-container">
            <h2 id="form-title">ចុះឈ្មោះភ្ញៀវថ្មី</h2>
            <form id="guest-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">ឈ្មោះភ្ញៀវ <span style="color:red;">*</span></label>
                    <input type="text" id="name" required placeholder="ឧ. ឈឹម វិសាល">
                </div>

                <div class="form-group">
                    <label for="phone">លេខទូរស័ព្ទ</label>
                    <input type="tel" id="phone" placeholder="ឧ. 012 345 678">
                </div>

                <div class="form-group">
                    <label for="address">អាសយដ្ឋាន</label>
                    <input type="text" id="address" placeholder="ឧ. រាជធានីភ្នំពេញ">
                </div>

                <div class="form-group">
                    <label for="relation">ប្រភេទទំនាក់ទំនង</label>
                    <select id="relation">
                        <option value="ខាងកូនកំលោះ">ខាងកូនកំលោះ</option>
                        <option value="ខាងកូនក្រមុំ">ខាងកូនក្រមុំ</option>
                        <option value="ផ្សេងៗ">ផ្សេងៗ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="companions">ចំនួនអ្នកមកជាមួយ (នាក់)</label>
                    <input type="number" id="companions" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="gift">ចំនួនប្រាក់ចងដៃ ($)</label>
                    <input type="number" id="gift" min="0" value="0" step="0.01" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="notes">កំណត់សម្គាល់</label>
                    <textarea id="notes" placeholder="ព័ត៌មានបន្ថែម..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit-text">ចុះឈ្មោះភ្ញៀវ</button>
                <button type="button" class="btn-cancel" id="btn-cancel" onclick="resetForm()">បោះបង់ការកែប្រែ</button>
            </form>
        </div>

        <!-- Guest List Section -->
        <div class="list-container">
            <div class="search-container">
                <input type="text" class="search-input" id="search" placeholder="ស្វែងរកតាមឈ្មោះ ឬ លេខទូរស័ព្ទ..." oninput="renderGuests()">
            </div>

            <div class="table-wrapper">
                <table id="guest-table">
                    <thead>
                        <tr>
                            <th>ឈ្មោះភ្ញៀវ</th>
                            <th>លេខទូរស័ព្ទ</th>
                            <th>ទំនាក់ទំនង</th>
                            <th>មកជាមួយ</th>
                            <th>ប្រាក់ចងដៃ</th>
                            <th>កំណត់សម្គាល់</th>
                            <th style="width: 140px;">សកម្មភាព</th>
                        </tr>
                    </thead>
                    <tbody id="guest-list">
                        <!-- Guest rows will be generated here dynamically -->
                    </tbody>
                </table>
                <div id="no-data-msg" class="no-data" style="display: none;">មិនទាន់មានទិន្នន័យភ្ញៀវឡើយ។</div>
            </div>
        </div>
    </div>
</div>

<script>
    // State Variables
    let guests = [];
    let editingId = null;

    // Load Data initially
    window.onload = function() {
        loadData();
        renderGuests();
    };

    // Load from LocalStorage
    function loadData() {
        const storedGuests = localStorage.getItem('wedding_guests');
        if (storedGuests) {
            guests = JSON.parse(storedGuests);
        } else {
            guests = [];
        }
    }

    // Save to LocalStorage
    function saveData() {
        localStorage.setItem('wedding_guests', JSON.stringify(guests));
        calculateDashboard();
    }

    // Handle Form Submit (Add or Edit)
    function handleFormSubmit(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim() || '-';
        const address = document.getElementById('address').value.trim() || '-';
        const relation = document.getElementById('relation').value;
        const companions = parseInt(document.getElementById('companions').value) || 0;
        const gift = parseFloat(document.getElementById('gift').value) || 0;
        const notes = document.getElementById('notes').value.trim() || '-';

        if (editingId) {
            // Edit Mode
            guests = guests.map(guest => {
                if (guest.id === editingId) {
                    return { ...guest, name, phone, address, relation, companions, gift, notes };
                }
                return guest;
            });
            editingId = null;
            document.getElementById('form-title').textContent = 'ចុះឈ្មោះភ្ញៀវថ្មី';
            document.getElementById('btn-submit-text').textContent = 'ចុះឈ្មោះភ្ញៀវ';
            document.getElementById('btn-cancel').style.display = 'none';
        } else {
            // Add Mode
            const newGuest = {
                id: Date.now(),
                name,
                phone,
                address,
                relation,
                companions,
                gift,
                notes
            };
            guests.push(newGuest);
        }

        saveData();
        renderGuests();
        resetForm();
    }

    // Render Guest List
    function renderGuests() {
        const searchQuery = document.getElementById('search').value.toLowerCase().trim();
        const guestList = document.getElementById('guest-list');
        const noDataMsg = document.getElementById('no-data-msg');
        
        guestList.innerHTML = '';

        // Filter guests based on Search input
        const filteredGuests = guests.filter(guest => 
            guest.name.toLowerCase().includes(searchQuery) || 
            guest.phone.toLowerCase().includes(searchQuery)
        );

        if (filteredGuests.length === 0) {
            noDataMsg.style.display = 'block';
        } else {
            noDataMsg.style.display = 'none';
            filteredGuests.forEach(guest => {
                let relationClass = 'tag-other';
                if (guest.relation === 'ខាងកូនកំលោះ') relationClass = 'tag-groom';
                if (guest.relation === 'ខាងកូនក្រមុំ') relationClass = 'tag-bride';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <strong>${escapeHTML(guest.name)}</strong><br>
                        <small style="color:#718096;">${escapeHTML(guest.address)}</small>
                    </td>
                    <td>${escapeHTML(guest.phone)}</td>
                    <td><span class="tag-relation ${relationClass}">${guest.relation}</span></td>
                    <td>+${guest.companions} នាក់</td>
                    <td style="font-weight: 600; color: #10b981;">$${guest.gift.toFixed(2)}</td>
                    <td style="font-size: 12px; color: #718096; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHTML(guest.notes)}">
                        ${escapeHTML(guest.notes)}
                    </td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editGuest(${guest.id})">កែប្រែ</button>
                        <button class="btn-action btn-delete" onclick="deleteGuest(${guest.id})">លុប</button>
                    </td>
                `;
                guestList.appendChild(row);
            });
        }

        calculateDashboard();
    }

    // Edit Guest function
    function editGuest(id) {
        const guest = guests.find(g => g.id === id);
        if (!guest) return;

        editingId = id;
        document.getElementById('name').value = guest.name;
        document.getElementById('phone').value = guest.phone === '-' ? '' : guest.phone;
        document.getElementById('address').value = guest.address === '-' ? '' : guest.address;
        document.getElementById('relation').value = guest.relation;
        document.getElementById('companions').value = guest.companions;
        document.getElementById('gift').value = guest.gift;
        document.getElementById('notes').value = guest.notes === '-' ? '' : guest.notes;

        document.getElementById('form-title').textContent = 'កែប្រែព័ត៌មានភ្ញៀវ';
        document.getElementById('btn-submit-text').textContent = 'រក្សាទុកការកែប្រែ';
        document.getElementById('btn-cancel').style.display = 'block';

        // Scroll to form on mobile devices
        document.querySelector('.form-container').scrollIntoView({ behavior: 'smooth' });
    }

    // Delete Guest function
    function deleteGuest(id) {
        if (confirm('តើអ្នកពិតជាចង់លុបទិន្នន័យភ្ញៀវម្នាក់នេះមែនទេ?')) {
            guests = guests.filter(g => g.id !== id);
            if (editingId === id) {
                resetForm();
            }
            saveData();
            renderGuests();
        }
    }

    // Calculate Dashboard numbers
    function calculateDashboard() {
        const totalRegistrations = guests.length;
        
        // Total Attendees = Guest himself (1) + companions
        const totalAttendees = guests.reduce((sum, guest) => sum + 1 + guest.companions, 0);
        
        // Total Gift money
        const totalGifts = guests.reduce((sum, guest) => sum + guest.gift, 0);

        document.getElementById('total-registrations').textContent = `${totalRegistrations} គ្រួសារ/នាក់`;
        document.getElementById('total-attendees').textContent = `${totalAttendees} នាក់`;
        document.getElementById('total-gifts').textContent = `$${totalGifts.toFixed(2)}`;
    }

    // Reset Form to Default
    function resetForm() {
        document.getElementById('guest-form').reset();
        editingId = null;
        document.getElementById('form-title').textContent = 'ចុះឈ្មោះភ្ញៀវថ្មី';
        document.getElementById('btn-submit-text').textContent = 'ចុះឈ្មោះភ្ញៀវ';
        document.getElementById('btn-cancel').style.display = 'none';
        document.getElementById('companions').value = 0;
        document.getElementById('gift').value = 0;
    }

    // Helper function to prevent XSS (Security check)
    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>

</body>
</html>
